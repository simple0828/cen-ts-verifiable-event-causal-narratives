experiment: cen_tats_environment_baseline
seed: 2025
dataset:
  path: data/processed/Environment.csv
  target: OT
  text_column: fact
  frequency: d
  features: S
model:
  name: iTransformer
  llm: GPT2
  llm_layers: 6
  local_files_only: true
  random_fallback: false
  seq_len: 24
  label_len: 12
  pred_len: 48
  text_emb: 12
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_ff: 2048
  dropout: 0.1
training:
  prior_weight: 0.5
  train_epochs: 5
  batch_size: 32
  learning_rate: 0.0001
  patience: 5
  use_amp: false
  use_cuda: true
