environment:
  conda_env: tats
  python_path: null # current interpreter (sys.executable)
  hf_home: ".cache/huggingface"

tats:
  model_path: null # CEN_TS_GPT2_PATH, otherwise models/gpt2 under the project
  pretrained: true
  local_files_only: true
  allow_random_fallback: false
  max_token_length: 256
  pooling: avg
  text_emb_dim: 12

training:
  backbone: iTransformer
  use_cuda: true
  gpu: 0
  seed: 2025
