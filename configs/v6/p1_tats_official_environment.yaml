data:
  dataset: Environment
  root_path: "./data"
  data_path: "Environment.csv"
  target: "OT"
  seq_len: 24
  label_len: 12
  pred_len: 48
  features: "S"
  frequency: null

tats:
  llm_model: "GPT2"
  model_path: null # CEN_TS_GPT2_PATH, otherwise models/gpt2 under the project
  pretrained: true
  local_files_only: true
  allow_random_fallback: false
  max_token_length: 256
  pooling: "avg"
  text_emb_dim: 12
  prior_weight: 0.5
  freeze_gpt2: true

training:
  backbone: "iTransformer"
  seed: 2025
  train_epochs: 5
  patience: 5
  batch_size: 32
  learning_rate: 0.0001
  use_cuda: true
  gpu: 0
  num_workers: 0
  max_windows_by_split: null
  use_amp: true
  deterministic: true

experiment:
  methods:
    - M0_Numerical-only
    - M1_TaTS-Raw-Text
    - Z0_Zero-Text-Control
    - S0_Shuffled-Text-Diagnostic
