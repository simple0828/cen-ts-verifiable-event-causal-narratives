dataset:
  name: Environment
  source_csv: data/processed/Environment.csv
  date_column: date
  text_column: fact
  target_column: OT
  official_train_ratio: 0.70
  official_val_ratio: 0.10
  official_test_ratio: 0.20

split:
  train_core_ratio_within_train: 0.85
  prompt_dev_ratio_within_train: 0.15
  use_model_val: false
  use_test: false

extractor:
  provider: openai_compatible
  model_from_env: CEN_EXTRACTOR_MODEL
  temperature: 0.0
  max_output_tokens: 1800
  timeout_seconds: 120
  max_retries: 3
  concurrency: 4
  batch_size: 4
  strict_json: true
  external_knowledge_allowed: false

sampling:
  train_core_unique_texts: 160
  prompt_dev_unique_texts: 40
  stability_repeat_samples: 20
  seed: 2026
  stratify_by_text_length: true
  stratify_by_date: true

cache:
  enabled: true
  directory: .cache/cen_ts/events
  store_raw_response: true
  store_parsed_response: true

rendering:
  max_events_per_timestamp: 5
  no_event_text: "No material event was identified in the provided text."
  include_evidence: true
  include_confidence: false
