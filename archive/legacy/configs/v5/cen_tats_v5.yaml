data:
  datasets: ["Energy"]
  candidate_datasets: ["Energy", "Health_US", "Health_AFR"]
  history_length: 24
  label_len: 12
  horizons: [3]
  target: "OT"
events:
  min_type_support: 3
causal:
  max_lag: 7
  min_support: 5
verifier:
  weights:
    evidence: 0.35
    causal: 0.35
    cycle: 0.20
    lag_fit: 0.10
apo:
  beam_width: 3
  candidates_per_parent: 3
  max_depth: 3
  minibatch_size: 16
  stage_a_top_k: 5
  stage_b_top_k: 2
  weights:
    forecast: 1.0
    event: 0.2
    cycle: 0.2
    grounding: 0.2
    schema: 0.2
    token: 0.01
tats:
  llm_model: "openai-community/gpt2"
  lm_mode: "random_init_input_embedding_only_pretrained_weights_timeout"
  max_token_length: 256
  pooling: "avg"
  embedding_seed: 2026
  embedding_batch_size: 64
training:
  backbone: "PatchTST"
  seeds: [2024, 2025, 2026]
  ablation_seeds: [2024]
  epochs: 1
  batch_size: 32
  learning_rate: 0.001
  text_emb_dim: 12
  d_model: 32
  n_heads: 4
  e_layers: 1
  d_ff: 64
  dropout: 0.1
  label_len: 12
  use_cuda: false
  max_windows_by_split:
    train_core: 192
    prompt_dev: 48
    model_val: 64
    test: 96
llm:
  extractor_model: ""
  causal_teacher_model: ""
  inverse_event_model: ""
  verifier_model: ""
  apo_critic_model: ""
  apo_editor_model: ""
  evaluator_model: ""
