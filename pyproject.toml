[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cen-ts"
version = "0.1.0"
description = "Verifiable causal event narratives for text-paired time series forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.17.1",
  "pyyaml==6.0.3",
  "matplotlib==3.11.0",
]

[project.optional-dependencies]
tats = [
  "torch==2.7.0",
  "transformers==5.13.1",
  "huggingface-hub==1.23.0",
  "safetensors==0.8.0",
  "reformer-pytorch==1.4.4",
  "einops==0.8.2",
  "sktime==1.0.1",
  "tqdm==4.68.4",
]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cen_ts", "cen_ts.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["third_party"]
markers = [
  "integration: requires local GPT-2 weights and/or CUDA (skips if unavailable)",
]
